<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HoloClass · Tarjetas</title>
  <script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/cv.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-aruco2@2.0.0/src/aruco.js"></script>
  <style>
    body { font-family: Inter, system-ui, sans-serif; margin: 0; padding: 16px; background: #eef1f8; color: #111; }
    header { max-width: 900px; margin: 0 auto 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; max-width: 900px; margin: 0 auto; }
    .card { background: #fff; border-radius: 12px; border-top: 8px solid var(--c); padding: 14px; text-align: center; break-inside: avoid; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .card .marker { width: 5cm; height: 5cm; margin: 8px auto; }
    .card .marker svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; }
    .card h3 { margin: 6px 0 2px; } .card small { color: #555; }
    button { padding: 8px 14px; border-radius: 8px; border: 0; background: #4f46e5; color: #fff; font-weight: 600; cursor: pointer; }
    @media print { header { display: none; } body { background: #fff; padding: 0; } .card { box-shadow: none; border: 1px solid #ccc; border-top: 8px solid var(--c); } }
  </style>
</head>
<body>
  <header>
    <h1>Tarjetas HoloClass</h1>
    <p>Imprime en papel <b>mate</b> (sin reflejos) sin escalar la página para que cada marcador mida 5 cm, o abre esta página en tu celular y muestra una tarjeta a la cámara con el brillo al máximo.</p>
    <button onclick="print()">🖨 Imprimir</button>
  </header>
  <div class="grid" id="grid"></div>
  <script>
    const cards = [
      [1, 'Corazón humano', 'Anatomía', '#EF4444', '🫀'],
      [2, 'Sistema solar', 'Astronomía', '#6366F1', '🪐'],
      [3, 'La Tierra', 'Astronomía', '#6366F1', '🌍'],
      [4, 'Júpiter', 'Astronomía', '#6366F1', '🟠'],
      [8, 'Saturno', 'Astronomía', '#6366F1', '🪐'],
      [5, 'Agua · H₂O', 'Química', '#10B981', '💧'],
      [6, 'Dióxido de carbono · CO₂', 'Química', '#10B981', '🫧'],
      [7, 'Metano · CH₄', 'Química', '#10B981', '🔥'],
    ];
    const dic = new AR.Dictionary('ARUCO_MIP_36h12');
    document.getElementById('grid').innerHTML = cards.map(([id, t, s, c, i]) =>
      `<div class="card" style="--c:${c}"><small>${s}</small><h3>${i} ${t}</h3>
       <div class="marker">${dic.generateSVG(id)}</div><small>Marcador #${id} · ARUCO_MIP_36h12</small></div>`).join('');
  </script>
</body>
</html>
